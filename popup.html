<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Studio Focus</h1>
  <label class="row"><span>Focus mode</span><input type="checkbox" id="enabled"></label>
  <div class="row pause"><span id="status"></span><button id="pause15">Pause 15 min</button></div>
  <div class="row"><span>Unlocks per day <small id="used"></small></span><input type="number" id="limit" min="0" max="20" step="1"></div>
  <label for="channels">My channels <small>(one per line: @handle, channel ID or URL)</small></label>
  <textarea id="channels" rows="4" placeholder="@mychannel"></textarea>
  <p class="hint">Studio is always open. Listed channels stay visible on youtube.com.</p>
  <script src="popup.js"></script>
</body></html>
